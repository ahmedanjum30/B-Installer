[workspace]
resolver = "3"
members = ["crates/format", "crates/bi", "crates/setup"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
authors = ["Ahmad Anjum"]

[workspace.dependencies]
format = { path = "crates/format" }
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz", "optimization"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = "0.62.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
